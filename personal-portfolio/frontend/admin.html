<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Admin - Dashboard</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-container">
    <header>
      <h1>Portfolio Admin Dashboard</h1>
      <button id="logout-btn" class="logout-btn">Logout</button>
    </header>

    <nav class="sidebar">
      <ul>
        <li><a href="#" data-tab="projects" class="tab-link active">Projects</a></li>
        <li><a href="#" data-tab="messages" class="tab-link">Messages</a></li>
        <li><a href="#" data-tab="settings" class="tab-link">Settings</a></li>
      </ul>
    </nav>

    <main class="content">
      <!-- Projects Tab -->
      <section id="projects-tab" class="tab-content active">
        <h2>Manage Projects</h2>
        <button id="add-project-btn" class="btn btn-primary">Add New Project</button>
        
        <div id="projects-list" class="projects-list">
          <p>Loading projects...</p>
        </div>

        <!-- Add/Edit Project Form -->
        <div id="project-form-modal" class="modal hidden">
          <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3 id="form-title">Add New Project</h3>
            <form id="project-form">
              <div class="form-group">
                <label for="project-title">Title:</label>
                <input type="text" id="project-title" required>
              </div>
              <div class="form-group">
                <label for="project-description">Description:</label>
                <textarea id="project-description" required></textarea>
              </div>
              <div class="form-group">
                <label for="project-image">Image URL:</label>
                <input type="url" id="project-image">
              </div>
              <div class="form-group">
                <label for="project-link">Project Link:</label>
                <input type="url" id="project-link">
              </div>
              <div class="form-group">
                <label for="project-technologies">Technologies (comma-separated):</label>
                <input type="text" id="project-technologies">
              </div>
              <button type="submit" class="btn btn-primary">Save Project</button>
            </form>
          </div>
        </div>
      </section>

      <!-- Messages Tab -->
      <section id="messages-tab" class="tab-content">
        <h2>Messages</h2>
        <div id="messages-list" class="messages-list">
          <p>Loading messages...</p>
        </div>
      </section>

      <!-- Settings Tab -->
      <section id="settings-tab" class="tab-content">
        <h2>Settings</h2>
        <div class="settings-container">
          <h3>Portfolio Information</h3>
          <form id="settings-form">
            <div class="form-group">
              <label for="portfolio-name">Portfolio Name:</label>
              <input type="text" id="portfolio-name">
            </div>
            <div class="form-group">
              <label for="portfolio-bio">Bio:</label>
              <textarea id="portfolio-bio"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Settings</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
